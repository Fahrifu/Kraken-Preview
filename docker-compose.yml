services:
  postgres:
    image: postgres:17
    container_name: kraken-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kraken
      POSTGRES_PASSWORD: kraken
      POSTGRES_DB: kraken_esports
    ports:
      - "5432:5432"
    volumes:
      - kraken_postgres_data:/var/lib/postgresql/data

volumes:
  kraken_postgres_data:
